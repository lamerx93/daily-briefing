<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Briefing</title>
<meta name="description" content="A daily briefing on AI, agents and consumer credit in Asia.">
<meta name="theme-color" content="#3f5a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Briefing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="paydown" id="paydown" role="progressbar" aria-label="How far through today's edition you are" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<p class="notice" id="notice" role="status" hidden></p>
<main id="app">
  <header class="hero">
    <div class="hero-top"><span class="mark">Daily Briefing</span></div>
    <h1 class="poster"><span>Daily</span><span>Briefing</span></h1>
    <p class="hero-sub">Loading today's edition.</p>
  </header>
</main>
<noscript><p class="notice">The briefing needs JavaScript to load each day's edition.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
